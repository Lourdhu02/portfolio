name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # pnpm version comes from the packageManager field in package.json
    - uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Lint
      run: pnpm lint

    # Every bold figure in a post must exist in content/truth.ts
    - name: Check claims
      run: pnpm check:claims
      
    # Build runs velite first, which generates the #velite types the typecheck needs
    - name: Build
      run: pnpm build

    - name: Typecheck
      run: pnpm tsc --noEmit
